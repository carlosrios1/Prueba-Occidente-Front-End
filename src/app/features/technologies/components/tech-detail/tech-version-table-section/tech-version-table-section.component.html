<app-card [padding]="0">
    <app-card-body>
        @if (pagedCycles().length > 0) {
        <div class="p-5">
            <app-tech-version-filters [searchTerm]="searchTerm()"
                (searchChange)="onSearchChange($event)"></app-tech-version-filters>
        </div>
        <app-tech-version-table [filteredCycles]="pagedCycles()" [searchTerm]="searchTerm()"
            [getVersionStatus]="getVersionStatus" [formatDate]="formatDate"></app-tech-version-table>
        <div class="p-5">
            <app-table-pagination [actualPage]="paginationService.actualPage()"
                [cantidadPorPagina]="paginationService.itemsPerPage()" [totalItems]="filteredCycles().length"
                [loading]="false" [itemLabel]="'versiones'"
                (pageChange)="paginationService.goToPage($event)"></app-table-pagination>
        </div>
        } @else if (searchTerm()) {
        <app-table-empty-state title="No se encontraron versiones" [icon]="icons.SearchX"
            description="Ninguna versión coincide con los filtros de búsqueda aplicados. Intenta ajustar tus criterios para ver más resultados."
            [action]="{label: 'Limpiar Búsqueda', action: clearSearch, icon: icons.Trash}">
        </app-table-empty-state>
        } @else {
        <app-table-empty-state title="No hay versiones disponibles" [icon]="icons.GitBranch"
            description="No se encontraron versiones registradas para esta tecnología.">
        </app-table-empty-state>
        }
    </app-card-body>
</app-card>
