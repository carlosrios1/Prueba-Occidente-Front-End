<app-card [padding]="0">
    <app-card-body>
        <div class="flex flex-col">
            <div class="p-5">
                <app-tech-table-filters></app-tech-table-filters>
            </div>
            <app-tech-table></app-tech-table>
            <div class="p-5">
                <app-table-pagination [actualPage]="techState.currentPage()" [cantidadPorPagina]="techState.pageSize()"
                    [totalItems]="techState.totalElements()" [loading]="techState.isPaginating()"
                    [itemLabel]="'Tecnologías'" (pageChange)="onPageChange($event)">
                </app-table-pagination>
            </div>
        </div>
    </app-card-body>
</app-card>
