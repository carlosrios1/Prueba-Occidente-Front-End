<div class="border-y border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900">
    <table class="w-full">
        <thead>
            <tr class="border-b border-gray-200/60 dark:border-neutral-800">
                @for (header of headers; track $index) {
                <th class="py-3 px-2 text-left text-sm font-medium text-black dark:text-neutral-100 tracking-tight"
                    [class.pl-4]="$index === 0">
                    {{ header }}
                </th>
                }
            </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 dark:divide-neutral-800">
            @for (award of state.awards(); track award.id) {
            <tr class="group transition-all duration-300 hover:bg-gradient-to-r hover:from-green-50/30 hover:to-green-50/20 dark:hover:from-green-900/20 dark:hover:to-green-800/10 motion-preset-slide-down motion-duration-300">

                <td appTableCell variant="first">{{ award.id }}</td>

                <td appTableCell variant="name">
                    <span class="flex items-center gap-2">
                        <lucide-icon [img]="icons.Trophy" class="size-4 text-yellow-500 flex-shrink-0"></lucide-icon>
                        {{ award.awardName }}
                    </span>
                </td>

                <td appTableCell>{{ award.description }}</td>

                <td appTableCell>
                    <div class="flex items-center gap-1">
                        <app-button appearance="text" size="small" [icon]="icons.Pencil" variant="secondary"
                            tooltip="Editar" (onClick)="editAward.emit(award)">
                        </app-button>
                        <app-button appearance="text" size="small" [icon]="icons.Trash2" variant="danger"
                            tooltip="Eliminar" (onClick)="deleteAward.emit(award)">
                        </app-button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>

    @if (state.awards().length === 0 && !state.isLoading()) {
    <div class="flex flex-col items-center justify-center py-16 gap-3 text-gray-400 dark:text-neutral-500">
        <lucide-icon [img]="icons.Trophy" class="size-10 opacity-40"></lucide-icon>
        <p class="text-sm">No hay premios registrados.</p>
    </div>
    }
</div>
