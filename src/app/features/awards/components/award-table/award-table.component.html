<div class="border-y border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900">
    <table class="w-full">
        <thead>
            <tr class="border-b border-gray-200/60 dark:border-neutral-800">
                @for (header of headers; track $index) {
                <th class="py-3 px-2 text-left text-sm font-medium text-black dark:text-neutral-100 tracking-tight"
                    [class.pl-4]="$index === 0">
                    {{ header }}
                </th>
                }
            </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 dark:divide-neutral-800">
            @for (award of state.awards(); track award.id) {
            <tr
                class="group transition-all duration-300 hover:bg-gradient-to-r hover:from-green-50/30 hover:to-green-50/20 dark:hover:from-green-900/20 dark:hover:to-green-800/10 motion-preset-slide-down motion-duration-300">

                <td appTableCell variant="first">{{ award.id }}</td>

                <td appTableCell variant="name">
                    <span class="flex items-center gap-2">
                        <lucide-icon [img]="icons.Trophy" class="size-4 text-yellow-500 flex-shrink-0"></lucide-icon>
                        {{ award.awardName }}
                    </span>
                </td>

                <td appTableCell>{{ award.description }}</td>

                <td appTableCell>
                    <div class="flex items-center gap-1">
                        <app-button appearance="text" size="small" [icon]="icons.Pencil" variant="secondary"
                            tooltip="Editar" (onClick)="editAward.emit(award)">
                        </app-button>
                        <app-button appearance="text" size="small" [icon]="icons.Trash2" variant="danger"
                            tooltip="Eliminar" (onClick)="deleteAward.emit(award)">
                        </app-button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>

    @if (state.awards().length === 0 && !state.isLoading()) {
    <div class="py-16 text-center">
        <div class="mx-auto w-16 h-16 bg-gray-100 dark:bg-base-100 rounded-full flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-gray-400 dark:text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                </path>
            </svg>
        </div>
        <h3 class="text-sm font-medium text-gray-900 dark:text-gray-100 mb-1">No hay premios disponibles</h3>
        <p class="text-sm text-gray-500">Crea el primer premio para comenzar</p>
    </div>
    }
</div>
