<app-modal [isOpen]="isOpen()" title="Eliminar Premio"
    [subtitle]="'¿Estás seguro de que deseas eliminar el premio <strong>' + (award?.awardName ?? '') + '</strong>? Esta acción no se puede deshacer.'"
    [showFooter]="true" [showConfirmButton]="true" confirmText="Eliminar" cancelText="Cancelar"
    [loading]="state.isDeleting()" loadingText="Eliminando"
    [isDeleteModal]="true" [disableClose]="state.isDeleting()"
    (onClose)="close()" (onConfirm)="handleDelete()">
</app-modal>
