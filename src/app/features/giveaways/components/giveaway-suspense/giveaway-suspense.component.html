<div class="relative flex flex-col items-center justify-center gap-6 py-6 overflow-hidden min-h-72">

    <!-- Partículas flotantes de fondo -->
    <div class="particle p1 text-yellow-400 text-2xl">✦</div>
    <div class="particle p2 text-green-400 text-xl">✦</div>
    <div class="particle p3 text-pink-400 text-2xl">✦</div>
    <div class="particle p4 text-blue-400 text-xl">✦</div>
    <div class="particle p5 text-yellow-300 text-2xl">★</div>
    <div class="particle p6 text-emerald-300 text-2xl">★</div>

    <!-- Órbita central + trofeo -->
    <div class="relative w-40 h-40 flex items-center justify-center">

        <!-- Anillos de glow pulsante -->
        <div class="absolute inset-0 rounded-full bg-yellow-400/10 animate-ping" style="animation-duration: 2s;"></div>
        <div class="absolute inset-4 rounded-full bg-green-400/10 animate-ping" style="animation-duration: 2.7s; animation-delay: 0.6s;"></div>

        <!-- Anillo exterior punteado girando lento -->
        <div class="absolute inset-0 rounded-full border-2 border-dashed border-green-400/25 animate-spin" style="animation-duration: 12s;"></div>

        <!-- Anillo interior sólido girando al revés -->
        <div class="absolute inset-5 rounded-full border border-yellow-300/20 animate-spin" style="animation-duration: 5s; animation-direction: reverse;"></div>

        <!-- Bolas de sorteo orbitando -->
        @for (ball of orbitBalls; track ball.num; let i = $index) {
            <div class="orbit-ball" [class]="'orbit-ball-' + i">
                <div [class]="'w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-lg ' + ball.colorClass">
                    {{ ball.num }}
                </div>
            </div>
        }

        <!-- Trofeo central brillante -->
        <div class="trophy-glow relative z-10 w-20 h-20 rounded-full bg-gradient-to-br from-yellow-400 via-amber-500 to-orange-500 flex items-center justify-center shadow-2xl">
            <lucide-icon [img]="icons.Trophy" class="size-10 text-white drop-shadow-sm"></lucide-icon>
        </div>
    </div>

    <!-- Texto de etapa -->
    <div class="flex flex-col items-center gap-3 text-center px-4">
        <div class="text-3xl leading-none">{{ stage().emoji }}</div>
        <p class="text-sm font-semibold text-gray-800 dark:text-neutral-200 min-h-5">
            {{ stage().text }}
        </p>
        <!-- Puntos rebotando -->
        <div class="flex gap-1.5">
            @for (dot of [0, 1, 2]; track $index) {
                <div class="w-2 h-2 rounded-full bg-green-500 animate-bounce"
                     [style.animation-delay]="$index * 150 + 'ms'"></div>
            }
        </div>
    </div>

    <!-- Fila decorativa de bolas de lotería -->
    <div class="flex gap-2 flex-wrap justify-center">
        @for (ball of bottomBalls; track ball.num; let i = $index) {
            <div [class]="'w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-md animate-bounce ' + ball.colorClass"
                 [style.animation-delay]="i * 110 + 'ms'">
                {{ ball.num }}
            </div>
        }
    </div>

    <!-- Barra de progreso -->
    <div class="w-full max-w-xs px-4">
        <div class="flex justify-between text-xs text-gray-500 dark:text-neutral-400 mb-1.5">
            <span>Procesando sorteo</span>
            <span>Por favor espera...</span>
        </div>
        <div class="h-1.5 bg-gray-200 dark:bg-neutral-700 rounded-full overflow-hidden">
            <div class="progress-bar h-full rounded-full bg-gradient-to-r from-green-400 via-emerald-500 to-green-600 shadow-sm shadow-green-400/50"></div>
        </div>
    </div>

</div>
