<!-- Layout Principal -->
<div class="min-h-screen flex overflow-hidden">
  <app-sidebar></app-sidebar>

  <!-- Main content area con transiciones mejoradas -->
  <div class="flex flex-col flex-1 min-w-0 transition-all duration-300 ease-in-out" [ngClass]="{
         'ml-0': true,
         'md:ml-64': !isCollapsed,
         'md:ml-20': isCollapsed
       }">
    <div class="flex flex-col flex-1 min-h-screen">
      <app-header class="print:hidden flex-shrink-0"></app-header>

      <!-- Main content con scroll SOLO aquí -->
      <main class="flex-1 bg-whiteBO print:bg-transparent dark:bg-blackBG relative">
        <div #scrollContainer class="absolute inset-0 overflow-x-hidden overflow-y-auto custom-scrollbar">
          <!-- Loader posicionado aquí para que pueda ser absoluto o fijo según configuración -->
          <app-loader></app-loader>
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>
