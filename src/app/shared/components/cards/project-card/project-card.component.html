<app-card>
    <app-card-body>
        <div class="flex items-center justify-between group cursor-pointer">
            <div class="flex flex-col gap-3 w-full">
                <!-- Header with title and badges -->
                <div class="flex items-center gap-2 flex-wrap">
                    <span
                        class="font-semibold text-base dark:text-neutral-100 transition-colors duration-300 tracking-tight">
                        {{ project.title }}
                    </span>

                    <!-- Type Badge -->
                    <app-badge appearance="solid" variant="black" size="small" rounded="full">{{
                        project.type}}</app-badge>

                    <!-- Technology Badge -->
                    <app-badge appearance="solid" size="small" rounded="full"
                        [variant]="getTechnologyVariant(project.technology.color)" [ngClass]="">
                        {{ project.technology.name }} </app-badge>
                </div>

                <!-- Description -->
                <div>
                    <p class="text-neutral-600 text-sm dark:text-neutral-400 leading-relaxed">
                        {{ project.description }}
                    </p>
                </div>

                <!-- Metadata -->
                <div class="flex gap-4 items-center flex-wrap">
                    <!-- Version -->
                    <div class="flex items-center gap-1.5 
                      text-neutral-500 dark:text-neutral-400
                      hover:text-neutral-700 dark:hover:text-neutral-300
                      transition-colors duration-200">
                        <lucide-icon [img]="icons.GitBranch" class="size-4" [strokeWidth]="2">
                        </lucide-icon>
                        <p class="text-sm font-medium tracking-tight">
                            v.{{ project.version }}
                        </p>
                    </div>

                    <!-- Framework -->
                    <div class="flex items-center gap-1.5">
                        <div class="w-2 h-2 rounded-full bg-blue-500 dark:bg-blue-400"></div>
                        <p class="text-sm text-neutral-600 dark:text-neutral-400 
                      font-medium tracking-tight">
                            {{ project.framework }}
                        </p>
                    </div>

                    <!-- Developers -->
                    <div class="flex items-center gap-1.5 
                      text-neutral-500 dark:text-neutral-400
                      hover:text-neutral-700 dark:hover:text-neutral-300
                      transition-colors duration-200">
                        <lucide-icon [img]="icons.Users" class="size-4" [strokeWidth]="2">
                        </lucide-icon>
                        <p class="text-sm font-medium tracking-tight">
                            {{ project.developers }} {{ project.developers === 1 ? 'desarrollador' : 'desarrolladores'
                            }}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Optional chevron or action icon -->
            <div class="ml-4 opacity-0 group-hover:opacity-100 
                  transition-opacity duration-300
                  text-neutral-400 dark:text-neutral-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </div>
    </app-card-body>
</app-card>
